server {
	listen 80;

	index index.php index.html;

	root /var/www;

	# real visitor ip, sent by the wetfish/server proxy
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Real-IP;

	# docker's dns server, a variable in fastcgi_pass makes nginx look php up
	# again when it expires, so it finds the new php container after a deploy
	resolver 127.0.0.11 valid=5s ipv6=off;
	set $php_upstream php:9000;

	location / {
		autoindex on;
		try_files $uri $uri/ /index.php?hash=$uri;
	}

	location ~ \.php$ {
		try_files	$uri  =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass	$php_upstream;
		fastcgi_index	index.php;
		fastcgi_param	SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param	PATH_INFO $fastcgi_path_info;
		include		fastcgi_params;
  }
}
