; danger's own php settings, loaded on top of php.ini-production

; don't advertise the php version in headers
expose_php = Off

; mitigation for CVE-2026-115560 until php ships a fix,
; danger doesn't use sessions anyway
session.upload_progress.enabled = 0

; danger never opens urls with php's file functions
allow_url_fopen = Off

; posts are html sent as a form field, never file uploads
file_uploads = Off
post_max_size = 32M
