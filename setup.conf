# What wetfish/server sets up when danger is added to a server, see
# https://github.com/wetfish/server/blob/main/docs/how-it-works.md#project-setup
#
# <env file> <variable> <value>

# danger's database on the server's shared database
php.env DB_HOSTNAME  database host
php.env DB_DATABASE  database name
php.env DB_USERNAME  database user
php.env DB_PASSWORD  database password

# the domain post links point at
php.env SITE_URL     domain

# creates danger's tables, only when the server first creates its database
schema schema.sql
