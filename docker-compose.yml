# deployed with wetfish/server, see README.md
services:
  # httpd
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    # nginx needs php running before it starts
    depends_on:
      - php
    # fails if nginx can't reach php
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s

  # php-fpm
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    restart: unless-stopped
    # db connection info, written by wetfish/server from setup.conf on a
    # server, or copied from php.env.example for local development
    env_file:
      - ./php.env
    # passes once php-fpm accepts connections
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
