# deployed with wetfish/server, see README.md
services:
  # httpd
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    # nginx needs php running before it starts
    depends_on:
      - php
    # fails if nginx can't reach php
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s

  # php-fpm
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    restart: unless-stopped
    # db connection info
    env_file:
      - ./php.env
    depends_on:
      - db
    # passes once php-fpm accepts connections
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s

  # database
  db:
    build:
      context: .
      dockerfile: Dockerfile.mariadb
    restart: unless-stopped
    env_file:
      - ./mariadb.env
    volumes:
      - db:/var/lib/mysql
    # passes once mariadb accepts connections and innodb is ready
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s

volumes:
  # posts, kept across deploys
  db: {}
